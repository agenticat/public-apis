name: Generate APIs JSON

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse README to JSON
        run: |
          python - << 'EOF'
          import json
          import re

          apis = []
          current_category = "General"

          with open("README.md", "r", encoding="utf-8") as f:
              for line in f:
                  raw_line = line.strip()

                  # श्रेणी (Category) पहचानना
                  if raw_line.startswith("### "):
                      current_category = raw_line.replace("### ", "").strip()
                      continue

                  # टेबल पंक्तियाँ पहचानना
                  if "|" in raw_line:
                      parts = [p.strip() for p in raw_line.split("|")]
                      cols = [p for p in parts if p != ""]

                      if len(cols) >= 2:
                          col1 = cols[0]
                          col2 = cols[1]

                          # हेडर और डिवाइडर छोड़ना
                          if col1.lower() in ["api", "name"] or "---" in col1 or "---" in col2:
                              continue

                          # केवल नाम निकालना (URL हटा दिया गया है)
                          match = re.search(r'\[(.*?)\]\(.*?\)', col1)
                          name = match.group(1).strip() if match else col1.strip()

                          # केवल 3 फ़ील्ड्स जोड़ना
                          if name and col2:
                              apis.append({
                                  "name": name,
                                  "description": col2,
                                  "category": current_category
                              })

          with open("apis.json", "w", encoding="utf-8") as out:
              json.dump(apis, out, ensure_ascii=False, indent=2)

          print(f"सफलतापूर्वक कुल {len(apis)} APIs को JSON में सेव किया गया!")
          EOF

      - name: Commit and Push apis.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generate minimal apis.json [skip ci]"
          file_pattern: 'apis.json'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-apis-json
          path: apis.json
          
