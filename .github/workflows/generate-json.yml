name: Generate APIs JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse README to JSON
        run: |
          python - << 'EOF'
          import json
          import re

          apis = []
          current_category = "General"

          with open("README.md", "r", encoding="utf-8") as f:
              for line in f:
                  raw_line = line.strip()

                  # श्रेणी पहचानें
                  if raw_line.startswith("### "):
                      current_category = raw_line.replace("### ", "").strip()
                      continue

                  # टेबल की पंक्तियाँ पहचानें
                  if "|" in raw_line:
                      parts = [p.strip() for p in raw_line.split("|")]
                      # अगर लाइन | से शुरू या खत्म होती है तो खाली स्ट्रिंग्स को हटाएँ
                      cols = [p for p in parts if p != ""]

                      if len(cols) >= 2:
                          col1 = cols[0]
                          col2 = cols[1]

                          # हेडर या डिवाइडर छोड़ें
                          if col1.lower() in ["api", "name"] or "---" in col1 or "---" in col2:
                              continue

                          # लिंक और नाम निकालें
                          match = re.search(r'\[(.*?)\]\((.*?)\)', col1)
                          if match:
                              name = match.group(1).strip()
                              url = match.group(2).strip()
                          else:
                              name = col1.strip()
                              url = ""

                          # अतिरिक्त फ़ील्ड्स
                          auth = cols[2].replace("`", "") if len(cols) > 2 else "Unknown"
                          https = cols[3] if len(cols) > 3 else "Unknown"
                          cors = cols[4] if len(cols) > 4 else "Unknown"

                          if name and col2:
                              apis.append({
                                  "name": name,
                                  "description": col2,
                                  "category": current_category,
                                  "url": url,
                                  "auth": auth,
                                  "https": https,
                                  "cors": cors
                              })

          with open("apis.json", "w", encoding="utf-8") as out:
              json.dump(apis, out, ensure_ascii=False, indent=2)

          print(f"Extraction successful: {len(apis)} APIs extracted.")
          EOF

      - name: Commit and Push apis.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generate apis.json"
          file_pattern: 'apis.json'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-apis-json
          path: apis.json
          
